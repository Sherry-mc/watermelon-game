                // 清除所有水果
                if (this.world) {
                    const bodies = Matter.Composite.allBodies(this.world);
                    const fruits = bodies.filter(b => b.fruitIndex !== undefined);
                    World.remove(this.world, fruits);
                }
                
                // 重置游戏状态
                this.score = 0;
                this.isGameOver = false;
                this.canDrop = true;
                this.nextFruitIndex = Math.floor(Math.random() * 3);
                this.bombCount = 3;
                this.magicCount = 3;
                this.magicActive = false;
                this.selectedFruit = null;
                this.setupComplete = false;
                this.gameMode = 'fixed';
                this.unlimitedPowerups = false; // 重置无限模式
                
                // 重置模式按钮状态
                document.getElementById('fixedModeBtn').classList.add('active');
                document.getElementById('rotateModeBtn').classList.remove('active');
                
                document.getElementById('score').textContent = '0';
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('victoryOverlay').style.display = 'none';
                this.hideMagicHint();
                
                // 重置杯子角度
                this.cupAngle = 0;
                document.getElementById('angleSlider').value = 0;
                document.getElementById('angleValue').textContent = '0°';
                document.getElementById('cupPreview').style.transform = 'rotate(0deg)';
                document.getElementById('cupRotatable').style.transform = 'rotate(0deg)';
                
                // 清除道具发光效果
                document.getElementById('bombBtn').style.boxShadow = '';
                document.getElementById('magicBtn').style.boxShadow = '';
                
                // 显示设置界面
                document.getElementById('setupOverlay').style.display = 'flex';
                
                this.updatePreview();
                this.updatePowerupsUI();
            }
            
            updatePowerupsUI() {
                // 无限模式下显示∞符号
                const bombCountDisplay = this.unlimitedPowerups ? '∞' : this.bombCount;
                const magicCountDisplay = this.unlimitedPowerups ? '∞' : this.magicCount;
                
                document.getElementById('bombCount').textContent = bombCountDisplay;
                document.getElementById('magicCount').textContent = magicCountDisplay;
                
                // 🔥 无限模式下道具永远可用，永不变黑（禁用）
                if (this.unlimitedPowerups) {
                    document.getElementById('bombBtn').disabled = this.isGameOver;
                    document.getElementById('magicBtn').disabled = this.isGameOver;
                } else {
                    document.getElementById('bombBtn').disabled = (this.bombCount <= 0) || this.isGameOver;
                    document.getElementById('magicBtn').disabled = (this.magicCount <= 0) || this.isGameOver || this.magicActive;
                }
                
                document.getElementById('magicBtn').classList.toggle('active', this.magicActive);
            }
            
            // 💣 消除炸弹 - 清除全场最小的水果
            useBomb() {
                if ((!this.unlimitedPowerups && this.bombCount <= 0) || this.isGameOver) return;
                
                const { World } = Matter;
                const bodies = Matter.Composite.allBodies(this.world);
                const fruits = bodies.filter(b => b.fruitIndex !== undefined);
                
                if (fruits.length === 0) return;
                
                // 找到最小的水果等级
                let minIndex = Math.min(...fruits.map(f => f.fruitIndex));
                
                // 找出所有最小等级的水果
                const toRemove = fruits.filter(f => f.fruitIndex === minIndex);
                
                if (toRemove.length === 0) return;
                
                // 显示爆炸特效
                toRemove.forEach(fruit => {
                    this.showEffect(fruit.position.x, fruit.position.y, '💥');
                });
                
                // 移除水果
                World.remove(this.world, toRemove);
                
                // 非无限模式下才减少数量
                if (!this.unlimitedPowerups) {
                    this.bombCount--;
                }
                this.updatePowerupsUI();
            }
            
            // ✨ 融合魔法 - 选择两个不同水果强制合成
            useMagic() {
                if ((!this.unlimitedPowerups && this.magicCount <= 0) || this.isGameOver || this.magicActive) return;
                
                this.magicActive = true;
                this.selectedFruit = null;
                this.updatePowerupsUI();
                
                // 显示魔法提示
                document.getElementById('magicHint').classList.add('active');
                document.getElementById('magicHint').textContent = '✨ 点击选择第一个水果 ✨';
                
                // 提示玩家选择水果
                if (this.unlimitedPowerups) {
                    this.showHint('无限模式：请点击选择第一个水果！');
                } else {
                    this.showHint('请点击选择第一个水果！');
                }
            }
            
            hideMagicHint() {
                document.getElementById('magicHint').classList.remove('active');
            }
            
            showHint(text) {
                const hint = document.querySelector('.hint');
                const originalText = hint.textContent;
                hint.textContent = '✨ ' + text;
                hint.style.color = '#f1c40f';
                hint.style.fontWeight = 'bold';
                
                setTimeout(() => {
                    hint.textContent = originalText;
                    hint.style.color = 'rgba(255,255,255,0.8)';
                    hint.style.fontWeight = 'normal';
                }, 3000);
            }
            
            selectFruitForMagic(body) {
                if (!this.magicActive || body.fruitIndex === undefined) return;
                
                if (!this.selectedFruit) {
                    // 选择第一个水果
                    this.selectedFruit = body;
                    document.getElementById('magicHint').textContent = '✨ 点击选择第二个水果 ✨';
                    this.showHint('请点击选择第二个水果！');
                } else if (this.selectedFruit !== body) {
                    // 选择第二个水果，执行融合
                    this.performMagicMerge(this.selectedFruit, body);
                    this.selectedFruit = null;
                    this.magicActive = false;
                    this.hideMagicHint();
                }
            }
            
            performMagicMerge(bodyA, bodyB) {
                const { World, Bodies, Body } = Matter;
                
                const midX = (bodyA.position.x + bodyB.position.x) / 2;
                const midY = (bodyA.position.y + bodyB.position.y) / 2;
                
                // 计算新等级：取两者平均，偏向高一级
                const avgIndex = Math.floor((bodyA.fruitIndex + bodyB.fruitIndex) / 2);
                const newIndex = Math.min(avgIndex + 1, this.getItems().length - 1);
                const newItem = this.getItems()[newIndex];
                
                // 移除旧水果
                World.remove(this.world, [bodyA, bodyB]);
                
                // 创建新水果
                const newBody = Bodies.circle(midX, midY, newItem.radius, {
                    restitution: 0.3,
                    friction: 0.1,
                    density: 0.002,
                    render: { fillStyle: newItem.color }
                });
                
                newBody.fruitIndex = newIndex;
                newBody.isMerging = false;
                newBody.createdAt = Date.now(); // 记录创建时间，用于保护期
                
                // 给新水果一个最小向下速度，避免静止被误判为游戏结束
                Body.setVelocity(newBody, { x: 0, y: 0.5 });
                
                World.add(this.world, newBody);
                
                // 显示魔法特效
                this.showEffect(midX, midY, '✨');
                
                // 更新分数
                this.score += newItem.score * 2;
                document.getElementById('score').textContent = this.score;
                
                // 非无限模式下才减少魔法数量
                if (!this.unlimitedPowerups) {
                    this.magicCount--;
                }
                this.updatePowerupsUI();
            }
            
            showEffect(x, y, emoji) {
                const effect = document.createElement('div');
                effect.className = 'merge-effect';
                effect.textContent = emoji;
                effect.style.left = x + 'px';
                effect.style.top = y + 'px';
                effect.style.fontSize = '50px';
                this.gameArea.appendChild(effect);
                
                setTimeout(() => effect.remove(), 500);
            }
            
            gameLoop() {
                const render = () => {
                    // 清空画布
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    // 绘制待放置的水果
                    if (this.canDrop && !this.isGameOver) {
                        const items = this.getItems();
                        const fruit = items[this.nextFruitIndex];
                        this.ctx.font = `${fruit.radius * 2}px Arial`;
                        this.ctx.textAlign = 'center';
                        this.ctx.textBaseline = 'middle';
                        this.ctx.fillText(fruit.emoji, this.mouseX, 50);
                        
                        // 绘制虚线引导
                        this.ctx.beginPath();
                        this.ctx.setLineDash([5, 5]);
                        this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        this.ctx.moveTo(this.mouseX, 50 + fruit.radius);
                        this.ctx.lineTo(this.mouseX, this.canvas.height);
                        this.ctx.stroke();
                        this.ctx.setLineDash([]);
                    }
                    
                    // 绘制所有水果
                    const bodies = Matter.Composite.allBodies(this.world);
                    
                    for (let body of bodies) {
                        if (body.fruitIndex !== undefined) {
                            const items = this.getItems();
                            const fruit = items[body.fruitIndex];
                            
                            this.ctx.save();
                            this.ctx.translate(body.position.x, body.position.y);
                            this.ctx.rotate(body.angle);
                            
                            // 魔法模式：绘制可选框
                            if (this.magicActive) {
                                // 已选中的水果 - 金色边框
                                if (this.selectedFruit === body) {
                                    this.ctx.beginPath();
                                    this.ctx.arc(0, 0, fruit.radius + 5, 0, Math.PI * 2);
                                    this.ctx.strokeStyle = '#f1c40f';
                                    this.ctx.lineWidth = 4;
                                    this.ctx.stroke();
                                    
                                    // 发光效果
                                    this.ctx.beginPath();
                                    this.ctx.arc(0, 0, fruit.radius + 8, 0, Math.PI * 2);
                                    this.ctx.strokeStyle = 'rgba(241, 196, 15, 0.3)';
                                    this.ctx.lineWidth = 4;
                                    this.ctx.stroke();
                                } else {
                                    // 可选水果 - 紫色虚线框
                                    this.ctx.beginPath();
                                    this.ctx.arc(0, 0, fruit.radius + 4, 0, Math.PI * 2);
                                    this.ctx.strokeStyle = '#9b59b6';
                                    this.ctx.lineWidth = 2;
                                    this.ctx.setLineDash([4, 4]);
                                    this.ctx.stroke();
                                    this.ctx.setLineDash([]);
                                }
                            }
                            
                            // 绘制阴影
                            this.ctx.shadowColor = 'rgba(0,0,0,0.2)';
                            this.ctx.shadowBlur = 5;
                            this.ctx.shadowOffsetY = 3;
                            
                            // 绘制水果emoji
                            this.ctx.font = `${fruit.radius * 2}px Arial`;
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';
                            this.ctx.fillText(fruit.emoji, 0, 0);
                            
                            this.ctx.restore();
                        }
                    }
                    
                    // 绘制选中水果到其他水果的连线（魔法模式）
                    if (this.magicActive && this.selectedFruit) {
                        const mousePos = this.getMousePos();
                        
                        for (let body of bodies) {
                            if (body.fruitIndex !== undefined && body !== this.selectedFruit) {
                                const dist = Math.sqrt(
                                    Math.pow(body.position.x - mousePos.x, 2) + 
                                    Math.pow(body.position.y - mousePos.y, 2)
                                );
                                
                                if (dist < body.circleRadius + 10) {
                                    // 鼠标悬停的目标 - 绘制连线
                                    this.ctx.save();
                                    this.ctx.beginPath();
                                    this.ctx.moveTo(this.selectedFruit.position.x, this.selectedFruit.position.y);
                                    this.ctx.lineTo(body.position.x, body.position.y);
                                    this.ctx.strokeStyle = '#f1c40f';
                                    this.ctx.lineWidth = 3;
                                    this.ctx.setLineDash([5, 5]);
                                    this.ctx.stroke();
                                    this.ctx.restore();
                                    
                                    // 高亮目标
                                    this.ctx.save();
                                    this.ctx.translate(body.position.x, body.position.y);
                                    this.ctx.beginPath();
                                    this.ctx.arc(0, 0, body.circleRadius + 6, 0, Math.PI * 2);
                                    this.ctx.strokeStyle = '#f1c40f';
                                    this.ctx.lineWidth = 3;
                                    this.ctx.stroke();
                                    this.ctx.restore();
                                }
                            }
                        }
                    }
                    
                    // 检查游戏结束
                    if (!this.isGameOver) {
                        this.checkGameOver();
                    }
                    
                    requestAnimationFrame(render);
                };
                
                render();
            }
        }
        
        // 生成背景表情包
        function generateBgMemes() {
            const memes = ['😂', '🤣', '😍', '🥰', '😎', '🤩', '🥳', '😋', '🤪', '😜', 
                           '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
                           '🍕', '🍔', '🍟', '🌭', '🍿', '🍩', '🍪', '🎂', '🍰', '🧁',
                           '🔥', '💯', '✨', '🌟', '💫', '🎉', '🎊', '🎈', '🎁', '🏆',
                           '❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '💖'];
            const container = document.getElementById('bgMemes');
            const count = 40; // 表情包数量
            
            for (let i = 0; i < count; i++) {
                const meme = document.createElement('div');
                meme.className = 'meme-item';
                meme.textContent = memes[Math.floor(Math.random() * memes.length)];
                
                // 随机位置（避开中间游戏区域）
                let x, y;
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const safeZoneWidth = 400;
                const safeZoneHeight = 700;
                
                do {
                    x = Math.random() * (window.innerWidth - 60);
                    y = Math.random() * (window.innerHeight - 60);
                } while (
                    x > centerX - safeZoneWidth/2 && 
                    x < centerX + safeZoneWidth/2 && 
                    y > centerY - safeZoneHeight/2 && 
                    y < centerY + safeZoneHeight/2
                );
                
                meme.style.left = x + 'px';
                meme.style.top = y + 'px';
                meme.style.fontSize = (25 + Math.random() * 35) + 'px';
                meme.style.opacity = 0.08 + Math.random() * 0.12;
                meme.style.animationDelay = Math.random() * 8 + 's';
                meme.style.animationDuration = (6 + Math.random() * 6) + 's';
                meme.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(meme);
            }
        }
        
        // 排行榜管理
        const Leaderboard = {
            KEY: 'watermelon_game_leaderboard',
            
            getData() {
                const data = localStorage.getItem(this.KEY);
                return data ? JSON.parse(data) : [];
            },
            
            saveData(data) {
                localStorage.setItem(this.KEY, JSON.stringify(data));
            },
            
            addScore(name, score, mode) {
                const data = this.getData();
                data.push({
                    name: name || '匿名玩家',
                    score: score,
                    mode: mode,
                    date: new Date().toLocaleDateString()
                });
                
                // 排序并保留前5
                data.sort((a, b) => b.score - a.score);
                const top5 = data.slice(0, 5);
                
                this.saveData(top5);
                return top5;
            },
            
            render() {
                const data = this.getData();
                const container = document.getElementById('leaderboardList');
                
                if (data.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无记录，快来创造历史！</div>';
                    return;
                }
                
                container.innerHTML = data.map((item, index) => `
                    <div class="leaderboard-item">
                        <div class="leaderboard-rank rank-${index < 3 ? index + 1 : 'other'}">${index + 1}</div>
                        <div class="leaderboard-name">${item.name} ${item.mode === 'fruit' ? '🍉' : '🍔'}</div>
                        <div class="leaderboard-score">${item.score.toLocaleString()}</div>
                    </div>
                `).join('');
            }
        };
        
        // 启动游戏
        let game;
        window.onload = () => {
            generateBgMemes();
            game = new WatermelonGame();
            Leaderboard.render();
            
            // 显示初始设置界面
            document.getElementById('setupOverlay').style.display = 'flex';
        };
    </script>
</body>
