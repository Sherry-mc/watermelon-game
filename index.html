<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合成大西瓜 - 果汁杯版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 25%, #feca57 50%, #48dbfb 75%, #1dd1a1 100%);
            background-size: 400% 400%;
            animation: rainbow 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 背景表情包装饰 */
        .bg-memes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .meme-item {
            position: absolute;
            font-size: 40px;
            opacity: 0.15;
            animation: float-meme 8s ease-in-out infinite;
            filter: grayscale(30%);
            user-select: none;
        }
        
        @keyframes float-meme {
            0%, 100% { 
                transform: translateY(0) rotate(0deg); 
            }
            50% { 
                transform: translateY(-20px) rotate(5deg); 
            }
        }
        
        .game-container {
            position: relative;
            z-index: 1;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .score-board {
            background: rgba(255,255,255,0.95);
            padding: 12px 30px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        /* 角度变化倒计时 */
        .angle-timer {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: white;
            min-width: 60px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .angle-timer.show {
            opacity: 1;
        }
        
        .timer-icon {
            font-size: 24px;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .timer-countdown {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        .timer-label {
            font-size: 10px;
            opacity: 0.9;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
        }
        
        .juice-cup-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 可旋转的杯子整体 */
        .cup-rotatable {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.5s ease;
            transform-origin: center bottom; /* 以容器底部中心为旋转中心 */
            padding-top: 60px; /* 给吸管留出空间 */
        }
        
        /* 吸管 - 绝对定位在杯盖上方 */
        .straw {
            width: 12px;
            height: 60px;
            background: linear-gradient(90deg, #ff6b9d, #ff8fab);
            border-radius: 6px 6px 0 0;
            position: absolute;
            top: 15px;
            left: 50%;
            margin-left: -6px;
            z-index: 10;
            transform: rotate(-15deg);
            transform-origin: center bottom;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        
        .straw::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            border-radius: 10px 10px 0 0;
        }
        
        /* 杯盖 */
        .cup-lid {
            width: 340px;
            height: 25px;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
            border-radius: 15px 15px 5px 5px;
            position: relative;
            z-index: 5;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        

        #game-canvas {
            display: block;
        }
        
        /* 预览区域 */
        .preview-area {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        
        .preview-fruit {
            font-size: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            animation: float 1.5s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        /* 游戏结束线 */
        .danger-line {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                rgba(255,100,100,0.8) 0px,
                rgba(255,100,100,0.8) 10px,
                transparent 10px,
                transparent 20px
            );
            z-index: 50;
        }
        
        .danger-text {
            position: absolute;
            top: 60px;
            left: 5px;
            font-size: 10px;
            color: rgba(255,100,100,0.8);
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .mode-switcher {
            display: flex;
            background: rgba(255,255,255,0.9);
            border-radius: 25px;
            padding: 4px;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .mode-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: #666;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.3s ease;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .game-over h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .game-over p {
            color: #666;
            font-size: 18px;
            margin-bottom: 25px;
        }
        
        .fruit-legend {
            background: rgba(255,255,255,0.95);
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .fruit-legend-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .fruit-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        
        .fruit-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 12px;
        }
        
        .fruit-icon {
            font-size: 16px;
        }
        
        .hint {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 5px;
        }
        
        /* 合并特效 */
        .merge-effect {
            position: absolute;
            pointer-events: none;
            animation: mergePop 0.5s ease-out forwards;
            font-size: 30px;
            z-index: 200;
        }
        
        @keyframes mergePop {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* 道具栏 */
        .powerups-bar {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .powerup-btn {
            position: relative;
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 15px;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .powerup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .powerup-btn:not(:disabled):hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .powerup-bomb {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }
        
        .powerup-magic {
            background: linear-gradient(135deg, #a55eea 0%, #9b59b6 100%);
        }
        
        .powerup-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #2ecc71;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        
        .powerup-label {
            font-size: 10px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .powerup-btn.active {
            box-shadow: 0 0 0 4px #f1c40f, 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 选中效果 */
        .selected-fruit {
            box-shadow: 0 0 0 4px #f1c40f !important;
            animation: bounce 0.5s ease infinite alternate;
        }
        
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        
        /* 密码开挂区 */
        .cheat-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .cheat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .cheat-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .cheat-input:focus {
            border-color: #9b59b6;
            box-shadow: 0 0 10px rgba(155,89,182,0.3);
        }
        
        .cheat-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .cheat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(102,126,234,0.5);
        }
        
        /* 排行榜 */
        .leaderboard {
            margin-top: 15px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: #f8f9fa;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .leaderboard-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .leaderboard-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-right: 12px;
        }
        
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffed4e); color: #333; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); color: #333; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #daa520); color: white; }
        .rank-other { background: #e0e0e0; color: #666; }
        
        .leaderboard-name {
            flex: 1;
            font-weight: 500;
        }
        
        .leaderboard-score {
            font-weight: bold;
            color: #e74c3c;
        }
        
        /* 开挂胜利效果 */
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }
        
        .victory-content {
            text-align: center;
            animation: victoryPop 0.5s ease;
        }
        
        @keyframes victoryPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        
        .victory-emoji {
            font-size: 120px;
            animation: victoryBounce 1s ease infinite;
        }
        
        @keyframes victoryBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .victory-text {
            color: white;
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        
        .victory-subtext {
            color: #f1c40f;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .victory-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .star {
            position: absolute;
            color: #f1c40f;
            font-size: 24px;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 游戏开始设置界面 - 与游戏界面统一风格 */
        .setup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 25%, #feca57 50%, #48dbfb 75%, #1dd1a1 100%);
            background-size: 400% 400%;
            animation: rainbow 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 3000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .setup-content {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: auto;
        }
        
        .setup-content h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .setup-content p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .cup-preview-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            min-height: 200px;
            align-items: center;
        }
        
        .cup-preview {
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .cup-preview-straw {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%) rotate(-15deg);
            width: 12px;
            height: 60px;
            background: linear-gradient(90deg, #ff6b9d, #ff8fab);
            border-radius: 6px 6px 0 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        
        .cup-preview-straw::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            border-radius: 10px 10px 0 0;
        }
        
        .cup-preview-lid {
            width: 160px;
            height: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.8));
            border-radius: 12px 12px 5px 5px;
            position: relative;
            z-index: 5;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        
        .cup-preview-body {
            width: 140px;
            height: 180px;
            background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
            border-left: 6px solid rgba(255,255,255,0.7);
            border-right: 6px solid rgba(255,255,255,0.7);
            border-bottom: 6px solid rgba(255,255,255,0.7);
            border-radius: 0 0 25px 25px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.3);
        }
        
        .cup-preview-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,154,158,0.8) 0%, rgba(254,207,239,0.6) 100%);
            border-radius: 0 0 19px 19px;
        }
        
        .angle-control {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .angle-control label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .angle-control #angleValue {
            color: #e74c3c;
            font-size: 24px;
        }
        
        .angle-control input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(90deg, #f093fb, #f5576c, #feca57, #48dbfb, #1dd1a1);
            outline: none;
            -webkit-appearance: none;
            margin-bottom: 15px;
        }
        
        .angle-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 3px solid white;
        }
        
        .angle-hint {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            padding: 0 5px;
            font-weight: 500;
        }
        
        .btn-large {
            padding: 15px 50px;
            font-size: 20px;
            margin-top: 20px;
        }
        
        /* 游戏区域 - 可旋转的杯子 */
        .game-area {
            position: relative;
            width: 320px;
            height: 480px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            border-left: 8px solid rgba(255,255,255,0.6);
            border-right: 8px solid rgba(255,255,255,0.6);
            border-bottom: 8px solid rgba(255,255,255,0.6);
            border-radius: 0 0 30px 30px;
            overflow: hidden;
            box-shadow: 
                inset 0 0 30px rgba(255,255,255,0.2),
                0 10px 30px rgba(0,0,0,0.2);
        }
        
        /* 模式选择 */
        .mode-select {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .mode-select-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .mode-options {
            display: flex;
            gap: 10px;
        }
        
        .mode-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .mode-option:hover {
            border-color: #9b59b6;
            transform: translateY(-2px);
        }
        
        .mode-option.active {
            border-color: #9b59b6;
            background: linear-gradient(135deg, rgba(155,89,182,0.1), rgba(155,89,182,0.05));
            box-shadow: 0 4px 15px rgba(155,89,182,0.2);
        }
        
        .mode-icon {
            font-size: 28px;
        }
        
        .mode-name {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        
        .mode-desc {
            font-size: 11px;
            color: #666;
        }
        
        .btn-large {
            margin-top: 10px;
        }
        
        /* 角度变化提示 */
        .angle-change-hint {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 4000;
            animation: anglePopup 0.5s ease, fadeOut 0.5s ease 2.5s forwards;
            display: none;
        }
        
        .angle-change-hint.show {
            display: block;
        }
        
        @keyframes anglePopup {
            0% { transform: translateX(-50%) scale(0) translateY(-20px); opacity: 0; }
            100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 榨汁按钮 */
        .juice-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 25%, #48dbfb 50%, #ff9ff3 75%, #54a0ff 100%);
            background-size: 200% 200%;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            animation: juicePulse 1s ease infinite, juiceGradient 3s ease infinite;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .juice-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        
        .juice-btn:active {
            transform: scale(0.95);
        }
        
        @keyframes juicePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        @keyframes juiceGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 魔法模式可选提示 */
        .magic-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #a55eea 0%, #9b59b6 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse-hint 1s ease infinite;
            z-index: 60;
            display: none;
        }
        
        .magic-hint.active {
            display: block;
        }
        
        @keyframes pulse-hint {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }
        
        /* 果汁特效 */
        .juice-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(180deg, 
                rgba(255,100,100,0.9) 0%, 
                rgba(255,150,50,0.85) 20%,
                rgba(255,200,50,0.8) 40%,
                rgba(100,255,100,0.75) 60%,
                rgba(100,200,255,0.7) 80%,
                rgba(150,100,255,0.65) 100%);
            border-radius: 0 0 22px 22px;
            z-index: 30;
            transition: height 2s ease-out;
            overflow: hidden;
        }
        
        .juice-overlay.filling {
            height: 95%;
        }
        
        .juice-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 20px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255,255,255,0.6), 
                transparent);
            animation: juiceWave 2s linear infinite;
        }
        
        @keyframes juiceWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }
        
        .juice-bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .juice-bubble {
            position: absolute;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: bubbleRise 2s ease-in infinite;
        }
        
        @keyframes bubbleRise {
            0% { 
                transform: translateY(100%) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% { 
                transform: translateY(-20px) scale(1);
                opacity: 0;
            }
        }
        
        .juice-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            animation: juicePop 0.5s ease;
            z-index: 31;
        }
        
        @keyframes juicePop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <!-- 背景表情包装饰 -->
    <div class="bg-memes" id="bgMemes"></div>
    
    <!-- 角度变化提示 -->
    <div class="angle-change-hint" id="angleChangeHint">🌀 杯子倾斜改变！</div>
    
    <div class="game-container">
        <h1 class="title">🧃 合成大西瓜</h1>
        
        <div class="score-board">得分: <span id="score">0</span></div>
        
        <!-- 角度变化倒计时 -->
        <div class="angle-timer" id="angleTimer">
            <div class="timer-icon">🌀</div>
            <div class="timer-countdown" id="timerCountdown">10</div>
            <div class="timer-label">秒后倾斜</div>
        </div>
        
        <div class="juice-cup-wrapper" id="cupWrapper">
            <div class="cup-rotatable" id="cupRotatable">
                <div class="straw"></div>
                <div class="cup-lid"></div>
                <div class="game-area" id="gameArea">
                    <div class="danger-line"></div>
                    <div class="danger-text">⚠️ 警戒线</div>
                    <div class="magic-hint" id="magicHint">✨ 点击选择水果进行融合 ✨</div>
                    <div class="preview-area">
                        <div class="preview-fruit" id="previewFruit">🍇</div>
                    </div>
                    <canvas id="game-canvas"></canvas>
                    <!-- 果汁特效层 -->
                    <div class="juice-overlay" id="juiceOverlay">
                        <div class="juice-bubbles" id="juiceBubbles"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <p class="hint">👆 点击或拖动控制位置，松开放置</p>
        
        <!-- 榨汁按钮 -->
        <button class="juice-btn" id="juiceBtn" onclick="game.makeJuice()">
            🧃 榨汁！
        </button>
        
        <!-- 道具栏 -->
        <div class="powerups-bar">
            <button class="powerup-btn powerup-bomb" id="bombBtn" onclick="game.useBomb()">
                💣
                <span class="powerup-count" id="bombCount">3</span>
                <span class="powerup-label">消除炸弹</span>
            </button>
            <button class="powerup-btn powerup-magic" id="magicBtn" onclick="game.useMagic()">
                ✨
                <span class="powerup-count" id="magicCount">3</span>
                <span class="powerup-label">融合魔法</span>
            </button>
        </div>
        
        <div class="controls">
            <div class="mode-switcher">
                <button class="mode-btn active" id="fruitMode" onclick="game.switchMode('fruit')">🍉 水果模式</button>
                <button class="mode-btn" id="foodMode" onclick="game.switchMode('food')">🍔 美食模式</button>
                <button class="mode-btn" id="kaomojiMode" onclick="game.switchMode('kaomoji')">😐 颜文字模式</button>
            </div>
            <button class="btn btn-primary" onclick="game.restart()">🔄 重新开始</button>
        </div>
        
        <div class="fruit-legend">
            <div class="fruit-legend-title">水果合成路线</div>
            <div class="fruit-list"></div>
        </div>
        
        <!-- 密码输入区 -->
        <div class="cheat-section">
            <div class="cheat-input-wrapper">
                <input type="text" id="cheatInput" placeholder="输入神秘密码..." class="cheat-input">
                <button class="cheat-btn" onclick="game.checkCheatCode()">🔓</button>
            </div>
        </div>
        
        <!-- 排行榜 -->
        <div class="leaderboard">
            <div class="leaderboard-title">🏆 排行榜 TOP 5</div>
            <div class="leaderboard-list" id="leaderboardList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 游戏开始前设置界面 -->
    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-content">
            <h2>🎮 游戏设置</h2>
            <p>调整果汁杯角度，改变游戏难度！</p>
            
            <div class="cup-preview-container">
                <div class="cup-preview" id="cupPreview">
                    <div class="cup-preview-straw"></div>
                    <div class="cup-preview-lid"></div>
                    <div class="cup-preview-body">
                        <div class="cup-preview-liquid"></div>
                    </div>
                </div>
            </div>
            
            <div class="angle-control">
                <label>杯子角度: <span id="angleValue">0°</span></label>
                <input type="range" id="angleSlider" min="-45" max="45" value="0" oninput="game.updateAnglePreview(this.value)">
                <div class="angle-hint">
                    <span>↺ 向左倾斜</span>
                    <span>垂直</span>
                    <span>向右倾斜 ↻</span>
                </div>
            </div>
            
            <!-- 模式选择 -->
            <div class="mode-select">
                <div class="mode-select-title">🎮 选择游戏模式</div>
                <div class="mode-options">
                    <button class="mode-option active" id="fixedModeBtn" onclick="game.selectGameMode('fixed')">
                        <span class="mode-icon">🎯</span>
                        <span class="mode-name">固定模式</span>
                        <span class="mode-desc">杯子保持固定角度</span>
                    </button>
                    <button class="mode-option" id="rotateModeBtn" onclick="game.selectGameMode('rotate')">
                        <span class="mode-icon">🌀</span>
                        <span class="mode-name">旋转模式</span>
                        <span class="mode-desc">杯子随机倾斜增加难度</span>
                    </button>
                </div>
            </div>
            
            <button class="btn btn-primary btn-large" onclick="game.startGameWithAngle()">🎮 开始游戏</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2>🎮 游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button class="btn btn-primary" onclick="game.restart()">再玩一次</button>
        </div>
    </div>
    
    <!-- 开挂胜利弹窗 -->
    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-stars" id="victoryStars"></div>
        <div class="victory-content">
            <div class="victory-emoji" id="victoryEmoji">🍉</div>
            <div class="victory-text">🎉 恭喜通关！ 🎉</div>
            <div class="victory-subtext">开挂模式直接合成终极物品！</div>
            <button class="btn btn-primary" onclick="game.closeVictory()">继续游戏</button>
        </div>
    </div>

    <script>
        // 游戏配置 - 水果模式
        const FRUITS = [
            { emoji: '🍇', radius: 15, score: 2, color: '#9b59b6', name: '葡萄' },
            { emoji: '🍒', radius: 22, score: 4, color: '#e74c3c', name: '樱桃' },
            { emoji: '🍊', radius: 28, score: 8, color: '#f39c12', name: '橘子' },
            { emoji: '🍋', radius: 34, score: 16, color: '#f1c40f', name: '柠檬' },
            { emoji: '🥝', radius: 40, score: 32, color: '#8bc34a', name: '猕猴桃' },
            { emoji: '🍅', radius: 48, score: 64, color: '#ff6347', name: '番茄' },
            { emoji: '🍑', radius: 56, score: 128, color: '#ffb6c1', name: '桃子' },
            { emoji: '🍎', radius: 64, score: 256, color: '#ff6b6b', name: '苹果' },
            { emoji: '🍐', radius: 72, score: 512, color: '#d4e157', name: '梨' },
            { emoji: '🍉', radius: 85, score: 1024, color: '#2ecc71', name: '西瓜' }
        ];
        
        // 游戏配置 - 美食模式
        const FOODS = [
            { emoji: '🍬', radius: 15, score: 2, color: '#ff9ff3', name: '糖果' },
            { emoji: '🍫', radius: 22, score: 4, color: '#8b4513', name: '巧克力' },
            { emoji: '🍩', radius: 28, score: 8, color: '#d4a574', name: '甜甜圈' },
            { emoji: '🍪', radius: 34, score: 16, color: '#c4a77d', name: '曲奇' },
            { emoji: '🧁', radius: 40, score: 32, color: '#ffb6c1', name: '纸杯蛋糕' },
            { emoji: '🍰', radius: 48, score: 64, color: '#f4a460', name: '蛋糕' },
            { emoji: '🍕', radius: 56, score: 128, color: '#ffa500', name: '披萨' },
            { emoji: '🍔', radius: 64, score: 256, color: '#ff6b35', name: '汉堡' },
            { emoji: '🌮', radius: 72, score: 512, color: '#f4d03f', name: '卷饼' },
            { emoji: '🍱', radius: 85, score: 1024, color: '#e74c3c', name: '豪华便当' }
        ];

        // 游戏配置 - 颜文字模式
        const KAOMOJIS = [
            { emoji: '😐', radius: 15, score: 2, color: '#95a5a6', name: '冷漠' },
            { emoji: '🙂', radius: 22, score: 4, color: '#f1c40f', name: '微笑' },
            { emoji: '😊', radius: 28, score: 8, color: '#f39c12', name: '开心' },
            { emoji: '😄', radius: 34, score: 16, color: '#e67e22', name: '大笑' },
            { emoji: '😆', radius: 40, score: 32, color: '#ff9800', name: '坏笑' },
            { emoji: '😂', radius: 48, score: 64, color: '#ff5722', name: '笑哭' },
            { emoji: '🤣', radius: 56, score: 128, color: '#e74c3c', name: '笑趴' },
            { emoji: '😍', radius: 64, score: 256, color: '#e91e63', name: '花痴' },
            { emoji: '🥰', radius: 72, score: 512, color: '#ec407a', name: '亲亲' },
            { emoji: '🤩', radius: 85, score: 1024, color: '#ff1493', name: '星星眼' }
        ];

        class WatermelonGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameArea = document.getElementById('gameArea');
                this.canvas.width = 320;
                this.canvas.height = 480;
                
                this.score = 0;
                this.currentMode = 'fruit'; // 'fruit'、'food' 或 'kaomoji'
                this.nextFruitIndex = Math.floor(Math.random() * 3);
                this.isGameOver = false;
                this.canDrop = true;
                this.mouseX = this.canvas.width / 2;
                this.mouseY = 100;
                
                // 杯子角度设置
                this.cupAngle = 0; // 角度，范围 -45 到 45
                this.setupComplete = false;
                
                // 游戏模式: 'fixed'(固定) 或 'rotate'(旋转)
                this.gameMode = 'fixed';
                
                // 道具系统
                this.bombCount = 3;
                this.magicCount = 3;
                this.magicActive = false;
                this.selectedFruit = null;
                
                // 定时器
                this.angleChangeTimer = null;
                this.countdownInterval = null;
            }
            
            // 更新角度预览
            updateAnglePreview(angle) {
                this.cupAngle = parseInt(angle);
                document.getElementById('angleValue').textContent = this.cupAngle + '°';
                document.getElementById('cupPreview').style.transform = `rotate(${this.cupAngle}deg)`;
            }
            
            // 根据角度开始游戏
            startGameWithAngle() {
                this.setupComplete = true;
                document.getElementById('setupOverlay').style.display = 'none';
                
                // 应用杯子旋转
                this.updateCupVisuals();
                
                // 初始化物理引擎（带角度重力）
                this.initPhysics();
                this.initEvents();
                this.updatePreview();
                this.updateLegend();
                this.updatePowerupsUI();
                this.gameLoop();
                
                // 仅在旋转模式下启动角度变化
                if (this.gameMode === 'rotate') {
                    this.startAngleChangeTimer();
                }
            }
            
            // 启动角度变化定时器
            startAngleChangeTimer() {
                // 清除之前的定时器
                if (this.angleChangeTimer) {
                    clearTimeout(this.angleChangeTimer);
                }
                if (this.countdownInterval) {
                    clearInterval(this.countdownInterval);
                }
                
                // 显示倒计时
                document.getElementById('angleTimer').classList.add('show');
                
                const scheduleNextChange = () => {
                    const delay = 10000 + Math.random() * 5000; // 10-15秒
                    let remaining = Math.floor(delay / 1000);
                    
                    // 更新倒计时显示
                    document.getElementById('timerCountdown').textContent = remaining;
                    
                    // 启动倒计时动画
                    this.countdownInterval = setInterval(() => {
                        remaining--;
                        if (remaining >= 0) {
                            document.getElementById('timerCountdown').textContent = remaining;
                        }
                    }, 1000);
                    
                    this.angleChangeTimer = setTimeout(() => {
                        clearInterval(this.countdownInterval);
                        if (!this.isGameOver && this.setupComplete) {
                            this.changeAngleRandomly();
                            scheduleNextChange();
                        }
                    }, delay);
                };
                
                scheduleNextChange();
            }
            
            // 随机改变杯子角度
            changeAngleRandomly() {
                // 随机生成新角度（-35° 到 35°之间）
                const newAngle = Math.floor(Math.random() * 71) - 35;
                this.cupAngle = newAngle;
                
                // 更新视觉和物理
                this.updateCupVisuals();
                this.updatePhysicsGravity();
                
                // 显示提示
                this.showAngleChangeHint(newAngle);
            }
            
            // 更新杯子视觉效果
            updateCupVisuals() {
                // 旋转整个杯子容器（包括吸管、杯盖和游戏区域）
                document.getElementById('cupRotatable').style.transform = `rotate(${this.cupAngle}deg)`;
            }
            
            // 更新物理引擎重力方向
            updatePhysicsGravity() {
                if (!this.engine) return;
                
                const angleRad = (this.cupAngle * Math.PI) / 180;
                const gravityX = Math.sin(angleRad) * 1.2;
                const gravityY = Math.cos(angleRad) * 1.2;
                
                this.engine.gravity.x = gravityX;
                this.engine.gravity.y = gravityY;
            }
            
            // 显示角度变化提示
            showAngleChangeHint(angle) {
                const hint = document.getElementById('angleChangeHint');
                const direction = angle > 0 ? '向右' : angle < 0 ? '向左' : '回到垂直';
                const degree = Math.abs(angle);
                
                hint.textContent = `🌀 杯子${direction}倾斜 ${degree}°！`;
                hint.classList.add('show');
                
                // 3秒后隐藏
                setTimeout(() => {
                    hint.classList.remove('show');
                }, 3000);
            }
            
            // 选择游戏模式
            selectGameMode(mode) {
                this.gameMode = mode;
                
                // 更新按钮状态
                document.getElementById('fixedModeBtn').classList.toggle('active', mode === 'fixed');
                document.getElementById('rotateModeBtn').classList.toggle('active', mode === 'rotate');
            }
            
            getItems() {
                if (this.currentMode === 'fruit') return FRUITS;
                if (this.currentMode === 'food') return FOODS;
                return KAOMOJIS;
            }
            
            getMousePos() {
                return { x: this.mouseX, y: this.mouseY || 100 };
            }
            
            switchMode(mode) {
                if (this.currentMode === mode) return;
                
                this.currentMode = mode;
                
                // 更新按钮状态
                document.getElementById('fruitMode').classList.toggle('active', mode === 'fruit');
                document.getElementById('foodMode').classList.toggle('active', mode === 'food');
                document.getElementById('kaomojiMode').classList.toggle('active', mode === 'kaomoji');
                
                // 更新标题
                const titles = {
                    fruit: '🧃 合成大西瓜',
                    food: '🍱 合成豪华便当',
                    kaomoji: '😐 合成星星眼'
                };
                document.querySelector('.title').textContent = titles[mode];
                
                // 重新开始游戏
                this.restart();
                this.updateLegend();
            }
            
            updateLegend() {
                const items = this.getItems();
                const legendContainer = document.querySelector('.fruit-list');
                const title = document.querySelector('.fruit-legend-title');
                
                const legendTitles = {
                    fruit: '水果合成路线',
                    food: '美食合成路线',
                    kaomoji: '颜文字合成路线'
                };
                title.textContent = legendTitles[this.currentMode];
                
                legendContainer.innerHTML = items.map((item, index) => `
                    <div class="fruit-item">
                        <span class="fruit-icon">${item.emoji}</span>
                        ${item.name}
                    </div>
                    ${index < items.length - 1 ? '<div class="fruit-item">→</div>' : ''}
                `).join('');
            }
            
            initPhysics() {
                const { Engine, Render, Runner, World, Bodies, Body, Events, Composite } = Matter;
                
                // 根据杯子角度计算重力方向
                // 重力始终相对于杯子向下（垂直于杯子底部）
                const angleRad = (this.cupAngle * Math.PI) / 180;
                const gravityX = Math.sin(angleRad) * 1.2;
                const gravityY = Math.cos(angleRad) * 1.2;
                
                this.engine = Engine.create({
                    gravity: { x: gravityX, y: gravityY }
                });
                
                this.world = this.engine.world;
                
                // 创建边界
                const wallThickness = 50;
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                this.ground = Bodies.rectangle(width/2, height + wallThickness/2 - 5, width, wallThickness, { 
                    isStatic: true,
                    render: { fillStyle: 'transparent' },
                    friction: 0.5,
                    restitution: 0.2
                });
                
                this.leftWall = Bodies.rectangle(-wallThickness/2 + 8, height/2, wallThickness, height * 2, { 
                    isStatic: true,
                    render: { fillStyle: 'transparent' }
                });
                
                this.rightWall = Bodies.rectangle(width + wallThickness/2 - 8, height/2, wallThickness, height * 2, { 
                    isStatic: true,
                    render: { fillStyle: 'transparent' }
                });
                
                World.add(this.world, [this.ground, this.leftWall, this.rightWall]);
                
                // 碰撞检测
                Events.on(this.engine, 'collisionStart', (event) => {
                    const pairs = event.pairs;
                    
                    for (let i = 0; i < pairs.length; i++) {
                        const bodyA = pairs[i].bodyA;
                        const bodyB = pairs[i].bodyB;
                        
                        const items = this.getItems();
                        if (bodyA.fruitIndex !== undefined && bodyB.fruitIndex !== undefined &&
                            bodyA.fruitIndex === bodyB.fruitIndex && 
                            !bodyA.isMerging && !bodyB.isMerging) {
                            
                            // 两个最高级水果合成 -> 赢得游戏
                            if (bodyA.fruitIndex === items.length - 1) {
                                this.winGame(bodyA, bodyB);
                            } else {
                                this.mergeFruits(bodyA, bodyB);
                            }
                        }
                    }
                });
                
                // 运行物理引擎
                this.runner = Runner.create();
                Runner.run(this.runner, this.engine);
            }
            
            initEvents() {
                // 鼠标/触摸事件
                const handleMove = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    this.mouseX = clientX - rect.left;
                    this.mouseY = clientY - rect.top;
                    
                    if (this.isGameOver || !this.canDrop) return;
                    
                    // 限制在边界内
                    const fruit = this.getItems()[this.nextFruitIndex];
                    this.mouseX = Math.max(fruit.radius + 8, Math.min(this.canvas.width - fruit.radius - 8, this.mouseX));
                };
                
                const handleClick = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;
                    
                    // 如果魔法激活，尝试选择水果
                    if (this.magicActive) {
                        const bodies = Matter.Composite.allBodies(this.world);
                        for (let body of bodies) {
                            if (body.fruitIndex !== undefined) {
                                const dist = Math.sqrt(
                                    Math.pow(body.position.x - clickX, 2) + 
                                    Math.pow(body.position.y - clickY, 2)
                                );
                                if (dist < body.circleRadius + 10) {
                                    this.selectFruitForMagic(body);
                                    return;
                                }
                            }
                        }
                        return;
                    }
                    
                    // 正常投放水果
                    if (this.isGameOver || !this.canDrop) return;
                    this.dropFruit();
                };
                
                this.canvas.addEventListener('mousemove', handleMove);
                this.canvas.addEventListener('touchmove', handleMove, { passive: false });
                this.canvas.addEventListener('click', handleClick);
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleClick(e.changedTouches[0]);
                });
            }
            
            dropFruit() {
                if (!this.canDrop) return;
                
                this.canDrop = false;
                
                const { Bodies, World } = Matter;
                const fruit = this.getItems()[this.nextFruitIndex];
                
                const body = Bodies.circle(this.mouseX, 50, fruit.radius, {
                    restitution: 0.3,
                    friction: 0.1,
                    density: 0.002,
                    render: { fillStyle: fruit.color }
                });
                
                body.fruitIndex = this.nextFruitIndex;
                body.isMerging = false;
                body.createdAt = Date.now(); // 记录创建时间，用于保护期
                
                World.add(this.world, body);
                
                // 快速生成下一个水果 - 只等待300ms
                setTimeout(() => {
                    this.nextFruitIndex = Math.floor(Math.random() * 4);
                    this.updatePreview();
                    this.canDrop = true;
                }, 300);
            }
            
            mergeFruits(bodyA, bodyB) {
                const { World, Bodies, Body } = Matter;
                
                bodyA.isMerging = true;
                bodyB.isMerging = true;
                
                const midX = (bodyA.position.x + bodyB.position.x) / 2;
                const midY = (bodyA.position.y + bodyB.position.y) / 2;
                const newIndex = bodyA.fruitIndex + 1;
                const newFruit = this.getItems()[newIndex];
                const items = this.getItems();
                
                // 移除旧水果
                World.remove(this.world, [bodyA, bodyB]);
                
                // 创建新水果
                const newBody = Bodies.circle(midX, midY, newFruit.radius, {
                    restitution: 0.3,
                    friction: 0.1,
                    density: 0.002,
                    render: { fillStyle: newFruit.color }
                });
                
                newBody.fruitIndex = newIndex;
                newBody.isMerging = false;
                newBody.createdAt = Date.now(); // 记录创建时间，用于保护期
                
                // 传递速度，并确保有一个最小向下速度（避免静止被误判为游戏结束）
                const vy = Math.max((bodyA.velocity.y + bodyB.velocity.y) / 2, 0.5);
                Body.setVelocity(newBody, {
                    x: (bodyA.velocity.x + bodyB.velocity.x) / 2,
                    y: vy
                });
                
                World.add(this.world, newBody);
                
                // 更新分数
                this.score += newFruit.score;
                document.getElementById('score').textContent = this.score;
                
                // 显示合并特效
                this.showMergeEffect(midX, midY, newFruit.emoji);
                

            }
            
            showMergeEffect(x, y, emoji) {
                const effect = document.createElement('div');
                effect.className = 'merge-effect';
                effect.textContent = emoji;
                effect.style.left = x + 'px';
                effect.style.top = y + 'px';
                this.gameArea.appendChild(effect);
                
                setTimeout(() => effect.remove(), 500);
            }
            
            updatePreview() {
                const preview = document.getElementById('previewFruit');
                const items = this.getItems();
                preview.textContent = items[this.nextFruitIndex].emoji;
                preview.style.fontSize = (items[this.nextFruitIndex].radius * 1.5) + 'px';
            }
            
            checkGameOver() {
                const bodies = Matter.Composite.allBodies(this.world);
                let overLineCount = 0;
                const now = Date.now();
                
                // 警戒线Y坐标（相对于canvas）
                const dangerLineY = 80;
                
                for (let body of bodies) {
                    if (body.fruitIndex !== undefined && !body.isMerging) {
                        // 跳过刚创建的水果（1秒保护期）
                        if (body.createdAt && (now - body.createdAt < 1000)) {
                            continue;
                        }
                        
                        const fruitY = body.position.y;
                        const speed = Math.sqrt(body.velocity.x ** 2 + body.velocity.y ** 2);
                        
                        // 最原始的检测逻辑：水果Y坐标小于警戒线且速度很慢
                        // 只检测较大的水果（樱桃及以上）
                        if (fruitY < dangerLineY && 
                            speed < 0.3 && 
                            body.fruitIndex >= 1) {  // 樱桃及以上
                            overLineCount++;
                        }
                    }
                }
                
                // 多个水果超过警戒线才结束游戏（避免误判）
                if (overLineCount >= 2) {
                    this.endGame();
                }
            }
            
            endGame() {
                this.isGameOver = true;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOver').style.display = 'flex';
                
                // 添加到排行榜
                Leaderboard.addScore('玩家', this.score, this.currentMode);
                Leaderboard.render();
            }
            
            // 🏆 赢得游戏 - 两个最高级物品合成
            winGame(bodyA, bodyB) {
                const { World } = Matter;
                
                bodyA.isMerging = true;
                bodyB.isMerging = true;
                
                const items = this.getItems();
                const topItem = items[items.length - 1];
                const midX = (bodyA.position.x + bodyB.position.x) / 2;
                const midY = (bodyA.position.y + bodyB.position.y) / 2;
                
                // 移除两个最高级水果
                World.remove(this.world, [bodyA, bodyB]);
                
                // 更新分数
                this.score += topItem.score * 10;
                document.getElementById('score').textContent = this.score;
                
                // 显示合并特效
                this.showMergeEffect(midX, midY, topItem.emoji);
                
                // 显示胜利画面
                this.isGameOver = true;
                this.showVictory(topItem.emoji);
                
                // 添加到排行榜
                Leaderboard.addScore('玩家', this.score, this.currentMode);
                Leaderboard.render();
            }
            
            // 🔓 检查开挂密码

                const input = document.getElementById('cheatInput');

            // 🧃 榨汁！
            makeJuice() {
                const { World } = Matter;
                
                // 获取所有水果
                const bodies = Matter.Composite.allBodies(this.world);
                const fruits = bodies.filter(b => b.fruitIndex !== undefined);
                
                if (fruits.length === 0) {
                    this.showHint('杯子里没有水果可以榨汁！');
                    return;
                }
                
                // 计算果汁价值（基于水果总分）
                let juiceValue = 0;
                fruits.forEach(fruit => {
                    const items = this.getItems();
                    juiceValue += items[fruit.fruitIndex].score;
                });
                
                // 移除所有水果
                World.remove(this.world, fruits);
                
                // 增加分数
                this.score += Math.floor(juiceValue * 0.5);
                document.getElementById('score').textContent = this.score;
                
                // 显示果汁特效
                this.showJuiceEffect();
                
                // 显示提示
                this.showHint(`榨出了 ${fruits.length} 个水果的果汁！+${Math.floor(juiceValue * 0.5)}分`);
            }
            
            // 🧃 显示果汁特效
            showJuiceEffect() {
                const juiceOverlay = document.getElementById('juiceOverlay');
                const juiceBubbles = document.getElementById('juiceBubbles');
                
                // 清空之前的气泡
                juiceBubbles.innerHTML = '';
                
                // 添加气泡
                for (let i = 0; i < 15; i++) {

                    bubble.className = 'juice-bubble';
                    bubble.style.left = Math.random() * 100 + '%';
                    bubble.style.bottom = Math.random() * 50 + '%';
                    bubble.style.width = (5 + Math.random() * 15) + 'px';
                    bubble.style.height = bubble.style.width;
                    bubble.style.animationDelay = Math.random() * 2 + 's';
                    bubble.style.animationDuration = (1.5 + Math.random() * 1) + 's';
                    juiceBubbles.appendChild(bubble);
                }
                
                // 触发果汁填充动画
                setTimeout(() => {
                    juiceOverlay.classList.add('filling');
                }, 100);
                
                // 2秒后显示完成标志

                    const complete = document.createElement('div');
                    complete.className = 'juice-complete';

                    hint.textContent = '一杯果汁完成了！';
                    juiceOverlay.appendChild(hint);
                }, 2000);
            }
            
            // 清除果汁特效
            clearJuiceEffect() {
                const juiceOverlay = document.getElementById('juiceOverlay');
                const juiceBubbles = document.getElementById('juiceBubbles');
                juiceOverlay.classList.remove('filling');
                juiceBubbles.innerHTML = '';

                const complete = juiceOverlay.querySelector('.juice-complete');
                if (complete) complete.remove();

                if (hint && hint.textContent === '一杯果汁完成了！') hint.remove();
            }
            
            // 关闭胜利画面
            closeVictory() {
                document.getElementById('victoryOverlay').style.display = 'none';
            }
            
            restart() {
                // 保存作弊模式状态，使重新开始后仍然保持无限道具
                const wasUnlimited = this.unlimitedPowerups;
                
                // 显示设置界面，让用户重新选择角度
                this.showSetupScreen();
                
                // 恢复作弊模式状态
                if (wasUnlimited) {
                    this.unlimitedPowerups = true;
                    this.bombCount = 9999;
                    this.magicCount = 9999;
                    this.updatePowerupsUI();
                    // 恢复发光效果
                    document.getElementById('bombBtn').style.boxShadow = '0 0 20px #ff6b6b, 0 0 40px #ff6b6b';
                    document.getElementById('magicBtn').style.boxShadow = '0 0 20px #a55eea, 0 0 40px #a55eea';
                }
            }
            
            // 显示设置界面
            showSetupScreen() {
                const { World } = Matter;
                
                // 清除角度变化定时器
                if (this.angleChangeTimer) {
                    clearTimeout(this.angleChangeTimer);
                    this.angleChangeTimer = null;
                }
                if (this.countdownInterval) {
                    clearInterval(this.countdownInterval);
                    this.countdownInterval = null;
                }
                
                // 隐藏倒计时
                document.getElementById('angleTimer').classList.remove('show');
